<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Under Construction</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #1d4ed8 0%, #0f172a 50%, #1d4ed8 100%);
			font-family: 'Segoe UI', Arial, sans-serif;
			color: #fff;
			overflow: hidden;
		}

		.container {
			text-align: center;
			padding: 2rem;
		}

		.icon {
			font-size: 4rem;
			margin-bottom: 1.5rem;
			animation: spin 3s linear infinite;
			display: inline-block;
		}

		@keyframes spin {
			from {
				transform: rotate(0deg);
			}

			to {
				transform: rotate(360deg);
			}
		}

		h1 {
			font-size: clamp(2rem, 6vw, 4rem);
			letter-spacing: 4px;
			text-transform: uppercase;
			background: linear-gradient(90deg, #ffb703, #fb8500);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			margin-bottom: 1rem;
		}

		p {
			font-size: 1.1rem;
			color: #cfcfe0;
			margin-bottom: 2rem;
		}

		.bar {
			width: 260px;
			height: 6px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 3px;
			margin: 0 auto;
			overflow: hidden;
		}

		.bar-fill {
			width: 40%;
			height: 100%;
			background: linear-gradient(90deg, #ffb703, #fb8500);
			border-radius: 3px;
			animation: load 2s ease-in-out infinite;
		}

		@keyframes load {
			0% {
				margin-left: -40%;
			}

			50% {
				margin-left: 60%;
			}

			100% {
				margin-left: -40%;
			}
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="icon">⚙️</div>
		<h1>Under Construction</h1>
		<p>We're building something great. Check back soon!</p>
		<div class="bar">
			<div class="bar-fill"></div>
		</div>
	</div>
</body>

</html>
